services:
  controlplane:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/usr/local/bin/controlplane"]
    environment:
      - PORT=8080
      - STORAGE_DIR=/data/artifacts
      - CHROME_PATH=/usr/bin/chromium
    ports:
      - "8080:8080"
    volumes:
      - rpa_artifacts:/data/artifacts
    depends_on:
      redis:
        condition: service_healthy

  worker-a:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/usr/local/bin/worker"]
    environment:
      - WORKER_ID=worker-node-a
      - STORAGE_DIR=/data/artifacts
      - CHROME_PATH=/usr/bin/chromium
    deploy:
      resources:
        limits:
          memory: 512M
    volumes:
      - rpa_artifacts:/data/artifacts
    depends_on:
      - controlplane

  worker-b:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/usr/local/bin/worker"]
    environment:
      - WORKER_ID=worker-node-b
      - STORAGE_DIR=/data/artifacts
      - CHROME_PATH=/usr/bin/chromium
    deploy:
      resources:
        limits:
          memory: 512M
    volumes:
      - rpa_artifacts:/data/artifacts
    depends_on:
      - controlplane

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  rpa_artifacts:
